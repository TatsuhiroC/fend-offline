name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.signing.outputs.mode }}
      version: ${{ steps.signing.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install dependencies
        run: npm ci

      - name: Build and test web assets for the APK
        run: npm run test:web

      - name: Generate Android project
        run: npx cap add android

      # Replaces the Capacitor template icons and splash screen with fend branding.
      # Sources live in resources/ (the tool defaults to assets/, which is the web bundle here).
      - name: Generate app icons and splash screen
        run: >-
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#1a1a2e' --iconBackgroundColorDark '#1a1a2e'
          --splashBackgroundColor '#1a1a2e' --splashBackgroundColorDark '#1a1a2e'

      # Installs a stable release keystore (so APKs can be installed over each other)
      # and stamps versionCode/versionName. Branch builds without secrets use debug
      # signing; tagged releases fail if any required signing secret is missing.
      - name: Configure signing and version
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android.mjs

      - name: Build APK
        run: |
          set -euo pipefail
          cd android
          case "${{ steps.signing.outputs.mode }}" in
            release) ./gradlew assembleRelease ;;
            *)       ./gradlew assembleDebug ;;
          esac

      # A release APK that silently ends up unsigned would break every future upgrade,
      # so fail loudly here instead of shipping it.
      - name: Verify APK signature
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          APK="${{ steps.signing.outputs.apk_path }}"
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced (an unsigned build lands in app-release-unsigned.apk — the signing config did not apply)"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee apk-certs.txt
          node scripts/verify-apk-certs.mjs apk-certs.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fend-offline-${{ steps.signing.outputs.mode }}-apk
          path: ${{ steps.signing.outputs.apk_path }}

  publish:
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.mode == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # Publishing runs without checkout, npm dependencies, Gradle or signing secrets.
      - name: Attach verified APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name fend-offline-release-apk --dir artifact
          ASSET="fend-offline-${VERSION}.apk"
          cp artifact/app-release.apk "$ASSET"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$GITHUB_REF_NAME" --generate-notes
          fi
