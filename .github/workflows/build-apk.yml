name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets into www/
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      # Replaces the Capacitor template icons and splash screen with fend branding.
      # Sources live in resources/ (the tool defaults to assets/, which is the web bundle here).
      - name: Generate app icons and splash screen
        run: >-
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#1a1a2e' --iconBackgroundColorDark '#1a1a2e'
          --splashBackgroundColor '#1a1a2e' --splashBackgroundColorDark '#1a1a2e'

      # Installs a stable release keystore (so APKs can be installed over each other)
      # and stamps versionCode/versionName. Falls back to a debug build, with a warning,
      # when the signing secrets are not configured.
      - name: Configure signing and version
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android.mjs

      - name: Build APK
        run: |
          set -euo pipefail
          cd android
          case "${{ steps.signing.outputs.mode }}" in
            release) ./gradlew assembleRelease ;;
            *)       ./gradlew assembleDebug ;;
          esac

      # A release APK that silently ends up unsigned would break every future upgrade,
      # so fail loudly here instead of shipping it.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="${{ steps.signing.outputs.apk_path }}"
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced (an unsigned build lands in app-release-unsigned.apk — the signing config did not apply)"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee apk-certs.txt
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            if grep -q "^Signer #1 certificate DN: CN=Android Debug" apk-certs.txt; then
              echo "::error::release APK is signed with a debug key — the signing config was not applied"
              exit 1
            fi
          fi
          if [ -n "${{ secrets.ANDROID_CERT_SHA256 }}" ]; then
            # apksigner prints the digest without separators, so normalise whatever format
            # the secret uses (the docs suggest colons) before comparing.
            EXPECTED="$(printf '%s' "${{ secrets.ANDROID_CERT_SHA256 }}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            grep -qi "$EXPECTED" apk-certs.txt ||
              { echo "::error::APK certificate does not match ANDROID_CERT_SHA256"; exit 1; }
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fend-offline-${{ steps.signing.outputs.mode }}-apk
          path: ${{ steps.signing.outputs.apk_path }}

      - name: Attach APK to GitHub Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.signing.outputs.apk_path }}
          VERSION: ${{ steps.signing.outputs.version_name }}
        run: |
          ASSET="fend-offline-${VERSION:-$GITHUB_REF_NAME}.apk"
          cp "$APK" "$ASSET"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
