name: Deploy PWA to GitHub Pages

# Replaces the legacy "Deploy from a branch" (Jekyll) pipeline, whose last two builds
# failed with "Page build failed." Publishing the built www/ directory through
# actions/deploy-pages is deterministic and needs no Jekyll at all.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#   gh api -X PUT repos/TatsuhiroC/fend-offline/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'sw.js'
      - 'icon-*.png'
      - 'assets/**'
      - 'exchange-rates.xml'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Build and test static site
        run: npm run test:web

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
