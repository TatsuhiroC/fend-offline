<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="fend" />
<meta name="theme-color" content="#1a1a2e" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>fend</title>
<link rel="stylesheet" href="assets/App-CtSXWVvZ.css" />
<style>
	header {
		max-width: 80ch;
		margin: 0 auto;
		padding: 1ch 3ch;
		font-size: 0.72em;
		opacity: 0.6;
		border-bottom: 1px solid;
	}
	header p {
		margin: 0;
	}
</style>
</head>
<body>
<header>
	<p>by <a href="https://github.com/TatsuhiroC">TatsuhiroC</a> · <a href="https://github.com/TatsuhiroC/fend-offline">fend-offline</a> · engine <a href="https://github.com/printfn/fend">fend</a> (MIT)</p>
</header>
<div id="root"></div>
<script>
if ('serviceWorker' in navigator) {
	let updating = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (updating) location.reload();
	});
	navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
		const offerUpdate = () => {
			if (!registration.waiting || !navigator.serviceWorker.controller || document.getElementById('app-update')) return;
			const button = document.createElement('button');
			button.id = 'app-update';
			button.textContent = 'Update available — tap to reload';
			button.onclick = () => {
				if (!registration.waiting) { location.reload(); return; }
				updating = true;
				button.disabled = true;
				registration.waiting.postMessage('SKIP_WAITING');
			};
			document.querySelector('header').append(button);
		};
		registration.addEventListener('updatefound', () => {
			registration.installing?.addEventListener('statechange', offerUpdate);
		});
		offerUpdate();
		const check = () => {
			if (document.visibilityState === 'visible') registration.update().catch(console.warn);
		};
		document.addEventListener('visibilitychange', check);
		check();
	}).catch(console.warn);
}
</script>
<script type="module" src="assets/main-BGizNAwM.js"></script>
</body>
</html>
