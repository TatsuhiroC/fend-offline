<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="fend" />

<link rel="apple-touch-icon" href="icon-192.png" />
<title>fend</title>
<link rel="stylesheet" href="assets/App-CtSXWVvZ.css" />
<style>
	header {
		max-width: 80ch;
		margin: 0 auto;
		padding: 1ch 3ch;
		font-size: 0.72em;
		opacity: 0.6;
		border-bottom: 1px solid;
	}
	header p {
		margin: 0;
	}
	#rates-status { margin-top: 0.5em; }
</style>
</head>
<body>
<header>
	<p>by <a href="https://github.com/TatsuhiroC">TatsuhiroC</a> · <a href="https://github.com/TatsuhiroC/fend-offline">fend-offline</a> · engine <a href="https://github.com/printfn/fend">fend</a> (MIT)</p>
	<p id="rates-status" role="status"></p>
</header>
<div id="root"></div>
<script>
window.addEventListener('fend-rates', ({ detail }) => {
	const labels = { online: 'Online rates', saved: 'Local fallback · saved rates', bundled: 'Local fallback · built-in rates' };
	const update = detail.refreshing ? ' · Updating online rates…' :
		detail.failure === 'timeout' ? ' · Online update timed out' :
		detail.failure ? ' · Online update unavailable' : '';
	document.getElementById('rates-status').textContent = `${labels[detail.source]} · ${detail.date}${update}`;
});
const nativeApp = Boolean(window.Capacitor?.isNativePlatform?.());
if (nativeApp && 'serviceWorker' in navigator) {
	// APK assets are already offline. Retire browser caches without touching saved
	// rates in localStorage, so a new APK always uses its packaged frontend.
	(async () => {
		const registrations = await navigator.serviceWorker.getRegistrations();
		await Promise.all(registrations.map(registration => registration.unregister()));
		if ('caches' in window) {
			const keys = await caches.keys();
			await Promise.all(keys.filter(key => key.startsWith('fend-') || key.startsWith('fend:')).map(key => caches.delete(key)));
		}
		if (navigator.serviceWorker.controller) location.reload();
	})().catch(console.warn);
}
if ('serviceWorker' in navigator && !nativeApp) {
	const reportVersion = worker => {
		const version = document.querySelector('script[type="module"][src]')?.src.match(/\/assets\/([a-f0-9]{16})\//)?.[1];
		if (version) worker?.postMessage({ type: 'FEND_CLIENT_VERSION', version });
	};
	navigator.serviceWorker.addEventListener('message', event => {
		if (event.data?.type === 'FEND_REPORT_VERSION') reportVersion(event.source);
	});
	let updating = false;
	let controlled = Boolean(navigator.serviceWorker.controller);
	let offerUpdate = () => {};
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		reportVersion(navigator.serviceWorker.controller);
		if (updating) location.reload();
		else if (controlled) offerUpdate(true);
		controlled = true;
	});
	navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
		navigator.serviceWorker.ready.then(() => reportVersion(navigator.serviceWorker.controller)).catch(console.warn);
		offerUpdate = (activated = false) => {
			if ((!activated && !registration.waiting) || !navigator.serviceWorker.controller || document.getElementById('app-update')) return;
			const button = document.createElement('button');
			button.id = 'app-update';
			button.textContent = 'Update available — tap to reload';
			button.onclick = () => {
				if (!registration.waiting) { location.reload(); return; }
				updating = true;
				button.disabled = true;
				registration.waiting.postMessage('SKIP_WAITING');
			};
			document.querySelector('header').append(button);
		};
		registration.addEventListener('updatefound', () => {
			registration.installing?.addEventListener('statechange', () => offerUpdate());
		});
		offerUpdate();
		const check = () => {
			if (document.visibilityState === 'visible') {
				reportVersion(navigator.serviceWorker.controller);
				registration.update().catch(console.warn);
			}
		};
		document.addEventListener('visibilitychange', check);
		check();
	}).catch(console.warn);
}
</script>
<script type="module" src="assets/main-BGizNAwM.js"></script>
</body>
</html>
